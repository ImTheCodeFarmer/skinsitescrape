<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- SkinWagerTracker mark: a chip-dark tile with a rising wager line ending in a live dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d22"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- faint baseline grid -->
  <path d="M14 46h36M14 34h36M14 22h36" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <!-- area under the line -->
  <path d="M14 46 L24 38 L32 41 L41 27 L50 19 L50 46 Z" fill="#34d399" fill-opacity="0.14"/>
  <!-- the line -->
  <path d="M14 46 L24 38 L32 41 L41 27 L50 19" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live dot -->
  <circle cx="50" cy="19" r="5.5" fill="#0f1013"/>
  <circle cx="50" cy="19" r="3.5" fill="#34d399"/>
</svg>

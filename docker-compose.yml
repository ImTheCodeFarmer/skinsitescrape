services:
  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
      POSTGRES_DB: casino
    volumes:
      - dbdata:/var/lib/postgresql/data
    # dynamic_shared_memory_type=mmap keeps parallel workers off the 64 MB /dev/shm a container gets by default.
    command: postgres -c shared_preload_libraries=timescaledb -c max_connections=50 -c dynamic_shared_memory_type=mmap -c max_wal_size=2GB

volumes:
  dbdata:
